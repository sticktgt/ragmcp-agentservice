server:
  host: 0.0.0.0
  port: 2024
  reload: false

llm:
  provider: "litellm"   # litellm | yandexgpt
  liteLLM:
    model: yandex-chat   #alias of the proxy route in litellm.yaml
    api_base: http://localhost:4000/v1
    api_key:  $$$$$$$$$$$$$$$$$$$$$$$$
    folder_id: $$$$$$$$$$$$$$$$$$$$$$$$
    yandex_model: yandexgpt-lite # e.g., "yandexgpt" or "yandexgpt-lite"
    disable_logging: false
    temperature: 0.0
    timeout: 30
  yandexGPT:
    api_key: $$$$$$$$$$$$$$$$$$$$$$$$
    folder_id: $$$$$$$$$$$$$$$$$$$$$$$$
    model: yandexgpt-lite # e.g., "yandexgpt" or "yandexgpt-lite"
    # disable_logging: false
    temperature: 0.0
    timeout: 30

routing:
  mode: "precheck"      # precheck | TO:DO model-call
  defaultK: 5
  topN: 3
  allowRerank: "auto"   # on | off | auto
  forceSearchKeywords:
    ru: ["как","почему","ошибка","настроить","установить","спецификация","политика","инструкция","руководство","устранение","ссылки","источники","документация"]
    en: ["how","why","error","configure","install","spec","policy","guide","troubleshoot","steps","docs","links","sources","documentation"]
  rerankKeywords:
    ru: ["сравнение","сравнить","разница","лучшее","топ","обзор","против","плюсы","минусы","источники","ссылки","документация"]
    en: ["compare","difference","best","top","overview","vs","versus","pros and cons","sources","links","documentation"]    
  escalateIfRerankTriggers: true

mcp:
  servers:
    rag:
      transport: "streamable_http"
      url: "http://localhost:8080/mcp"
  toolName: "rag.search"
  requireTool: false   # <— if true, startup will fail when the tool is missing

  timeoutSec: 8
  ### for future use:
  citationDisplay: "basename"   # basename | relative | full
  pathPrefixStrip: "/mnt/docs"  # removed when citationDisplay=relative
  showPage: false               # whether to show page number in citation
  # uriBase: ""

limits:
  maxToolChars: 6000
  maxToolCallsPerTurn: 1

i18n:
  defaultLocale: ru
  enabled: [ru, en]

api:
  citations:
    enabled: true
    includeSnippet: true      # return snippet text? false = only source names
    snippetCharsLimit: 400     # trim snippet length if included
    includeScore: false        # optionally expose score
    includeUri: false          # for the future use